[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-custom-overlay"
dynamic = ["version"]
description = "Custom renderer for Engram's External Overlay Event API v2"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
tools = ["PyYAML>=6.0", "build>=1.2"]

[project.scripts]
engram-custom-overlay = "engram_overlay.__main__:main"

# The same entry point without a console. A v2 renderer is started by the user
# or by Windows rather than by Engram, so a console window would be a permanent
# black rectangle in the taskbar for the life of the session.
[project.gui-scripts]
engram-custom-overlayw = "engram_overlay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"engram_overlay.overlays" = [
    "assets/bolttagu_2d/*.png",
    "assets/bolttagu_2d/atlas.json",
    "assets/rabbit_2d/*.png",
    "assets/robot_arm_3d_v2/*.png",
    "assets/robot_arm_3d_v3/*.png",
]

[tool.setuptools.dynamic]
version = {attr = "engram_overlay._version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

