[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram-custom-overlay"
version = "0.1.0"
description = "Minimal custom renderer for Engram External Overlay Event API v1"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tools = ["PyYAML>=6.0"]

[project.scripts]
engram-custom-overlay = "engram_overlay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

